<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="60%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#060709"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#C3EC52"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Concentric Vinyl Waves -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Glowing Sound Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#neon)" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="14 24" filter="url(#glow)"/>

  <!-- Bold C Monogram Arc -->
  <path d="M 340 120 C 310 92 265 76 210 76 C 110 76 36 156 36 256 C 36 356 110 436 210 436 C 265 436 310 420 340 392"
        fill="none" stroke="url(#cGrad)" stroke-width="48" stroke-linecap="round" filter="url(#glow)"/>

  <!-- High-Energy Equalizer Frequency Spectrum Bars inside C -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="180" y="170" width="36" height="172" rx="18" fill="url(#neon)"/>
    <!-- Bar 2 (Peak) -->
    <rect x="250" y="120" width="36" height="272" rx="18" fill="url(#neon)"/>
    <!-- Bar 3 -->
    <rect x="320" y="185" width="36" height="142" rx="18" fill="url(#neon)"/>
    <!-- Bar 4 (Accent) -->
    <rect x="390" y="220" width="32" height="72" rx="16" fill="#C3EC52"/>
  </g>
</svg>